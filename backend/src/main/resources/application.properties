spring.application.name=client-crm-backend
server.port=${PORT:8080}

# Trusted Reverse Proxy Header Strategy (Render Envoy / Cloudflare proxy)
server.forward-headers-strategy=framework

# Database Configuration (MySQL / Cloud TiDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appzys_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345V}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Init (disabled by default so cloud database isn't overwritten)
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# Logging
logging.level.com.appzys=INFO
logging.level.org.hibernate.SQL=WARN

# Single-User Production Security Configuration
# All credentials and signing secrets must be explicitly provided via environment variables.
# Application startup fails if any value is missing or weak.
crm.security.username=${CRM_ACCESS_USERNAME:}
crm.security.password=${CRM_ACCESS_PASSWORD:}
crm.security.auth-secret=${CRM_AUTH_SECRET:}
crm.security.allowed-origins=${CRM_ALLOWED_ORIGINS:https://appzys-crm-frontend.onrender.com,http://localhost:3000}
crm.security.token-validity-hours=${CRM_TOKEN_VALIDITY_HOURS:336}
crm.security.max-login-attempts=${CRM_MAX_LOGIN_ATTEMPTS:5}
crm.security.lockout-minutes=${CRM_LOCKOUT_MINUTES:15}
