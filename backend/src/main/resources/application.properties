spring.application.name=client-crm-backend
server.port=${PORT:8080}

# Trusted Reverse Proxy Header Strategy (Render Envoy / Cloudflare proxy)
server.forward-headers-strategy=framework

# Database Configuration (MySQL / Cloud TiDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appzys_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345V}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Init (disabled by default so cloud database isn't overwritten)
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# Logging
logging.level.com.appzys=INFO
logging.level.org.hibernate.SQL=WARN

# Security & CORS
crm.security.auth-secret=${CRM_AUTH_SECRET:local-development-transient-secret-key-minimum-32-chars}
crm.security.master-admin-key=${CRM_MASTER_ADMIN_KEY:${CRM_SECURITY_MASTER_ADMIN_KEY:appzys-master-admin-key-minimum-32-chars}}
crm.security.allowed-origins=${CRM_ALLOWED_ORIGINS:https://appzys-crm-frontend.onrender.com,http://localhost:3000}
crm.security.token-validity-hours=${CRM_TOKEN_VALIDITY_HOURS:720}
crm.security.max-login-attempts=${CRM_MAX_LOGIN_ATTEMPTS:5}
crm.security.lockout-minutes=${CRM_LOCKOUT_MINUTES:15}

# Dedicated AI Integration Keys (Separate for Antigravity and ChatGPT Work)
crm.ai.antigravity-key=${CRM_AI_ANTIGRAVITY_KEY:ag-ai-key-sec-antigravity-crm-2026-v2}
crm.ai.chatgpt-key=${CRM_AI_CHATGPT_KEY:cg-ai-key-sec-chatgptwork-crm-2026-v2}
